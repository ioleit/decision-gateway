# The models the smoke example can use. uniform needs nothing; jev needs OPENROUTER_API_KEY
# (and golden/ answers made with jev, see make_golden.py).

[models.uniform]
backend = "uniform"

# Checked 2026-10-16 against https://openrouter.ai/api/v1/models/typesafe/jev-1.13/endpoints.
[models.jev]
backend = "openrouter"
model = "typesafe/jev-1.13"
provider = { only = ["typesafe"], allow_fallbacks = false }
version = "openrouter:typesafe/jev-1.13-20260917@typesafe"
served = "typesafe/jev-1.13-20260917"
