# The models the scripts and the page offer, by name: the same entries as the gateway's
# models.example.toml (see there for every field and how the requirements were chosen).
# OpenRouter models need OPENROUTER_API_KEY to ask; the page reads stored answers only and
# needs no key.

# Equal odds for every candidate: the no-preference reference, free and local.
[models.uniform]
backend = "uniform"
display_name = "Uniform (equal odds)"

[models.jev]
backend = "openrouter"
model = "typesafe/jev-1.13"
display_name = "TypeSafe Jev 1.13"
extra_body = { provider = { only = ["typesafe"], allow_fallbacks = false } }
requirements = { systemone_response_model_id = "typesafe/jev-1.13-20260917", openrouter_response_provider = "TypeSafe" }

