# models.toml: the models the router can ask, and how their answers may be cached.
#
# Copy this file to models.toml and keep the entries you need:
#
#     from decision_router import Cache, Router, models
#     router = Router(models.load("models.toml"), Cache())
#     router.ask("jev", request)
#
# Each model is a table [models.<name>]. <name> is what you pass to router.ask(), and the name
# its answers are stored under in the cache.
#
#
# ---- When is an answer reused? -------------------------------------------------------------
#
# The cache reuses an answer when the same model name, the same `version` and the same request
# (exactly as sent over the network) come again. It never asks that question again, and never
# replaces the answer.
#
# So `version` has to change whenever what answers could change: other weights, another
# provider, another quantization, a new model behind the same API id. The router cannot see
# any of that; it only knows the `version` you write here. A `version` that stays the same
# while the model changes mixes the answers of two models in one cache.
#
# How sure you can be depends on how the model is reached:
#
#   Your own server (backend = "http")
#       You choose the weights. Put everything that decides the answers into `version`: the
#       weights' commit, the quantization, the serving software if it matters. Nothing checks
#       it; it is as good as you keep it.
#
#   A hosted model with a dated id (backend = "openrouter")
#       Many providers give each model release a dated id ("typesafe/jev-1.13-20260917") and
#       report in every response which one answered. Write that id as `served`: an answer from
#       any other model raises ModelChangedError and is not cached. Pin the provider too
#       (`provider`), since two providers of one model can answer differently.
#       This relies on the provider giving a changed model a new dated id, which nobody
#       promises; it catches the changes that are announced.
#
#   A hosted model without a dated id
#       Nothing in the response says which model answered. Set `unpinned` to the time your run
#       starts: the router then asks new questions only for 24 hours after it and refuses
#       afterwards, so one run's answers come from one short window. Cached answers are still
#       served. For a new run, set a new `unpinned` and a new `version`, so the two runs never
#       share answers.
#
#   Not cached at all
#       `cache = false`: always asked, never stored. A model without a `version` is never
#       cached either.
#
#
# ---- Fields for every model ----------------------------------------------------------------
#
#   backend   how the model is reached: "uniform", "openrouter" or "http"           (required)
#   version   what answers, as it goes into the cache key; any string. Changing it means
#             every question is asked again.                    (required to cache; see above)
#   cache     false: always ask, never store                                   (default true)
#
#
# ---- backend = "uniform" -------------------------------------------------------------------
#
# A baseline that gives every option the same probability. No network, no key, no cost.
# Its version defaults to "uniform/1"; nothing else to set.
#
#
# ---- backend = "openrouter" ----------------------------------------------------------------
#
# Models on OpenRouter (https://openrouter.ai), asked through its decision endpoint.
#
#   model     the OpenRouter model id sent with each request ("typesafe/jev-1.13")
#   provider  OpenRouter's provider routing, sent with each request and part of the cache key.
#             only = ["<provider>"] and allow_fallbacks = false keep every answer with one
#             provider. Other options: https://openrouter.ai/docs/features/provider-routing
#   served    the dated model id every answer must report (see above)
#   unpinned  for a model without a dated id: when the run started; ISO time, as a string or
#             a TOML datetime ("2026-10-16T09:00:00Z"). No offset means UTC.
#   key_env   the environment variable with the API key            (default OPENROUTER_API_KEY)
#   url       the endpoint                        (default https://openrouter.ai/api/v1/systemone)
#   timeout   seconds per request                                                (default 900)
#   retries   attempts per question on HTTP 429, 5xx, timeouts; 1 = no retry       (default 3)
#
# The key is read only when a question is not in the cache, so a machine without it still
# serves every cached answer.
#
# A refusal (the provider declines to answer) is the model's answer: it is cached as a failed
# answer, {"type": ..., "failed": "refusal: ..."}, and not asked again.
#
#
# ---- backend = "http" ----------------------------------------------------------------------
#
# Any endpoint that takes the request as a JSON POST body and returns the response: your own
# server, a self-hosted model, another provider's compatible API. Same fields as "openrouter",
# with these differences:
#
#   url           required. {NAME} parts are filled from the environment, e.g.
#                 "https://{MY_HOST}/v1/systemone"
#   env_defaults  values for {NAME} parts the environment doesn't set
#   key_env       optional; leave it out for a server without a key, sent as "Bearer <key>"
#   model         sent as the request's "model"; "" sends none            (default: <name>)
#   unwrap        the field the response is wrapped in, if any ("result" for
#                 {"success": true, "result": {...}}); the whole reply is stored as `raw`
#
#
# ---- Examples ------------------------------------------------------------------------------

# The baseline. Useful for trying the router and for comparing against.
[models.uniform]
backend = "uniform"

# A hosted model with a dated id, pinned to one provider. (Checked 2026-10-16 against
# https://openrouter.ai/api/v1/models/typesafe/jev-1.13/endpoints.)
[models.jev]
backend = "openrouter"
model = "typesafe/jev-1.13"
provider = { only = ["typesafe"], allow_fallbacks = false }
version = "openrouter:typesafe/jev-1.13-20260917@typesafe"
served = "typesafe/jev-1.13-20260917"

# The rest are templates: replace the names, ids and hosts with your own.

# A hosted model without a dated id: one run, asked within 24 hours of `unpinned`.
# [models.undated]
# backend = "openrouter"
# model = "example-org/decider"
# provider = { only = ["example-provider"], allow_fallbacks = false }
# version = "openrouter:example-org/decider@example-provider run 2026-10-16"
# unpinned = "2026-10-16T09:00:00Z"

# The same hosted model, allowed to fall back to other providers. Answers may come from any
# of them, so they are not cached.
# [models.undated-any-provider]
# backend = "openrouter"
# model = "example-org/decider"
# cache = false

# Your own server, no key. The version names the weights you serve.
# [models.local]
# backend = "http"
# url = "http://localhost:8000/v1/systemone"
# model = ""
# version = "example-org/decider-4b@3f2a9c1 bf16"

# A server whose host comes from the environment, with a key.
# [models.team-server]
# backend = "http"
# url = "https://{DECIDER_HOST}/v1/systemone"
# env_defaults = { DECIDER_HOST = "decider.example.com" }
# key_env = "DECIDER_API_KEY"
# model = "decider-12b"
# version = "example-org/decider-12b@a17e0d4 int8"
# timeout = 120
# retries = 5

# An API that wraps its answer: {"success": true, "result": {...}}.
# [models.wrapped]
# backend = "http"
# url = "https://api.example.com/v1/decide"
# key_env = "EXAMPLE_API_KEY"
# unwrap = "result"
# version = "example-api/decider-2026-09"

# The baseline, asked every time and never stored.
# [models.uniform-uncached]
# backend = "uniform"
# cache = false
