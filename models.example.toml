# models.toml: the models, by name, and how the TypeSafe SDK client for each is configured.
#
# Copy this file to models.toml and keep the entries you need:
#
#     from decision_gateway import Router, SQLiteStore, labels, models
#
#     router = Router(models.load("models.toml"), SQLiteStore("evals.sqlite"), labels={"run": "2026-10"})
#     client = router.client("jev")           # a typesafe_sdk.TypeSafeClient
#     with labels(item=17):
#         response = client.system_one(state=..., questions={...})
#
# The client is the SDK's own; its requests go through the gateway, which answers from the
# store what was asked before and records every request and response.
#
#
# ---- The store ----------------------------------------------------------------------------
#
# Every response is recorded as an observation: what was sent, where, the response as
# received, the model and provider it reports, when, and the cost. Every request is recorded
# too: its labels, model name, which observation answered it, and whether it came
# from the store. A request is answered from the store when an observation for the same
# request (the body as sent, to the same endpoint) is there and the model's requirements
# accept it. Errors (HTTP errors, timeouts) are raised and not recorded. Requests with assets
# (images) are sent but not recorded yet.
#
#
# ---- Requirements -------------------------------------------------------------------------
#
# [models.<name>.requirements]
#
# Which answers this name accepts. Used to prevent different models served by the same
# backend configuration from sharing answers, for example minor updates without a version
# jump.
#
# Requirements are checked when stored answers are looked up and when a new response arrives.
# A response that isn't accepted stays recorded, and the call raises RequirementNotMetError;
# another name whose requirements accept it can use it without asking again.
#
#   systemone_response_model_id = "<id>"
#       The response's `model` is this id. In the System One API, `model` names the model that
#       served the request. OpenRouter puts its full model id there, with the release date
#       ("typesafe/jev-1.13-20260917"), also when the request asked for "typesafe/jev-1.13" or
#       an alias such as "jev-latest".
#
#   openrouter_response_provider = "<name>"
#       The response's `provider` is this name ("TypeSafe"). OpenRouter adds it to every
#       response.
#
#   request_date_range = ["<start>", "<end>"]
#       Only answers asked between these times count, and requests outside them are not sent.
#       ISO strings or TOML datetimes; no offset means UTC. A stopgap for models whose
#       responses say nothing about which model answered: it keeps one run's answers to a short
#       window, in which the model is assumed not to change.
#
#   "module:Class" = <value>
#       Your own subclass of decision_gateway.Requirement, built from the value: a table becomes
#       keyword arguments, anything else one argument. accepts() returns None if an observation
#       counts, or the reason it doesn't; allows_sending() can stop a request before it is sent.
#
#           from decision_gateway import Observation, Requirement
#
#           class MaxCost(Requirement):
#               def __init__(self, at_most: float) -> None:
#                   self.at_most = at_most
#
#               def accepts(self, observation: Observation) -> str | None:
#                   cost = observation.cost or 0.0
#                   return None if cost <= self.at_most else f"cost {cost} is above {self.at_most}"
#
#       and in models.toml:  "my_checks:MaxCost" = { at_most = 0.001 }
#
#
# ---- Fields -------------------------------------------------------------------------------
#
#   backend        "typesafe", "openrouter" or "uniform"; sets the defaults below
#                                                                        (default "typesafe")
#   model          the model id the client sends ("typesafe/jev-1.13")       (default: <name>)
#   display_name   a readable name, for pages and reports                   (default: <name>)
#   base_url       where the client sends requests; /v1/systemone is added
#                      typesafe:   TypeSafe's API (the SDK's default)
#                      openrouter: https://openrouter.ai/api
#   key_env        the environment variable with the API key
#                      typesafe:   TYPESAFE_API_KEY
#                      openrouter: OPENROUTER_API_KEY
#   extra_body     fields added to every request body where the call doesn't set them, e.g.
#                  OpenRouter's provider routing:
#                  { provider = { only = ["typesafe"], allow_fallbacks = false } } keeps every
#                  answer with one provider. Part of the request, so part of what is looked up.
#                  Other options: https://openrouter.ai/docs/features/provider-routing
#   extra_headers  headers added to every request
#   compression    false: send requests uncompressed       (openrouter: false; else the SDK's)
#   timeout        seconds per request                                 (default: the SDK's)
#   max_retries    retries on rate limits, server errors and timeouts  (default: the SDK's)
#   cache          false: always ask; answers are still recorded                (default true)
#   requirements   see above                                                     (default none)
#
#   backend = "uniform" is a local baseline that gives every option the same probability: no
#   network, no key, no cost, answers valid System One responses.
#
#
# ---- Examples -----------------------------------------------------------------------------

# The baseline. Useful for trying the gateway and for comparing against.
[models.uniform]
backend = "uniform"

# Jev through OpenRouter, one release from one provider. (Checked 2026-10-16 against
# https://openrouter.ai/api/v1/models/typesafe/jev-1.13/endpoints.)
[models.jev]
backend = "openrouter"
model = "typesafe/jev-1.13"
display_name = "Jev 1.13 (2026-09-17)"
extra_body = { provider = { only = ["typesafe"], allow_fallbacks = false } }

[models.jev.requirements]
systemone_response_model_id = "typesafe/jev-1.13-20260917"
openrouter_response_provider = "TypeSafe"

# The rest are templates: replace the names, ids and hosts with your own.

# Jev directly from TypeSafe. (The response's `model` there is TypeSafe's own name for the
# release, such as "jev-1.13.0"; check what it reports before you require it.)
# [models.jev-typesafe]
# model = "jev-1.13"
# display_name = "Jev 1.13 (TypeSafe)"
# requirements = { systemone_response_model_id = "jev-1.13.0" }

# A model whose responses don't say which release answered: one run, in a one-day window.
# [models.decider-2026-10-16]
# backend = "openrouter"
# model = "example-org/decider"
# extra_body = { provider = { only = ["example-provider"], allow_fallbacks = false } }
# requirements = { request_date_range = ["2026-10-16T09:00:00Z", "2026-10-17T09:00:00Z"] }

# The same model, allowed to fall back to other providers: answers may come from any of them,
# so stored answers are not reused (they are still recorded).
# [models.decider-any-provider]
# backend = "openrouter"
# model = "example-org/decider"
# cache = false

# Your own System One server. It reports the exact version in the response's `model`, and the
# requirement holds this name to one version.
# [models.decider-4b]
# base_url = "http://localhost:8000"
# key_env = "DECIDER_API_KEY"
# model = "decider-4b"
# timeout = 120
# max_retries = 5
# requirements = { systemone_response_model_id = "decider-4b@3f2a9c1" }

# A requirement of your own.
# [models.jev-cheap]
# backend = "openrouter"
# model = "typesafe/jev-1.13"
# requirements = { "my_checks:MaxCost" = { at_most = 0.001 } }

# The baseline, asked every time.
# [models.uniform-uncached]
# backend = "uniform"
# cache = false
