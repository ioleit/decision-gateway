# models.toml: the models the router can ask, by name.
#
# Copy this file to models.toml and keep the entries you need:
#
#     from decision_gateway import Cache, Router, models
#     client = Router(models.load("models.toml"), Cache())
#     response = client.system_one(state=..., questions={...}, model="jev")
#
# The router is a drop-in replacement for TypeSafe's SDK client (typesafe-sdk): system_one
# takes the same arguments and returns the same response. `model` is a name below, and the
# router sends the request through an SDK client configured as that entry says.
#
# The name is also what answers are stored under in the cache: it stands for one
# configuration (model id, provider pin and requirements), so a different model gets a
# different name.
#
#
# ---- The cache ----------------------------------------------------------------------------
#
# An answer is reused when the same model name, the same requirements and the same request
# body (as the SDK sends it) come again. It is never asked again and never replaced. Errors
# (HTTP errors, timeouts) are raised and not cached. Requests with assets (images) are sent but
# not cached yet.
#
#
# ---- Requirements -------------------------------------------------------------------------
#
# [models.<name>.requirements]
#
# Reject responses from the model if these conditions are not met. Used to prevent different
# models served by the same backend configuration from sharing a cache, for example minor
# updates without a version jump.
#
# A requirement that is not met stops the call with RequirementNotMetError: the question is
# not sent, or the response is not stored. Answers already in the cache are served as they are.
# Changing the requirements starts a new set of answers for the model.
#
#   systemone_response_model_id = "<id>"
#       The response's `model` is this id. In the System One API, `model` names the model that
#       served the request. OpenRouter puts its full model id there, with the release date
#       ("typesafe/jev-1.13-20260917"), also when the request asked for "typesafe/jev-1.13" or
#       an alias such as "jev-latest".
#
#   openrouter_response_provider = "<name>"
#       The response's `provider` is this name ("TypeSafe"). OpenRouter adds it to every
#       response.
#
#   request_date_range = ["<start>", "<end>"]
#       New questions only between these times: ISO strings or TOML datetimes, no offset means
#       UTC. A stopgap for models whose responses say nothing about which model answered: it
#       keeps one run's answers to a short window, in which the model is assumed not to change.
#
#   "module:Class" = <value>
#       Your own: a subclass of decision_gateway.requirements.RequestRequirement (checked before
#       a question is sent) or ResponseRequirement (checked on the response before it is
#       stored). It is built from the value: a table becomes keyword arguments, anything else
#       one argument. Its check() returns None if met, or the reason it is not. For example:
#
#           from decision_gateway import RoutedResponse
#           from decision_gateway.requirements import Asking, ResponseRequirement
#
#           class MaxProbability(ResponseRequirement):
#               def __init__(self, at_most: float) -> None:
#                   self.at_most = at_most
#
#               def check(self, asking: Asking, response: RoutedResponse) -> str | None:
#                   top = max(p for c in response.choices.values() for p in c.probabilities.values())
#                   return None if top <= self.at_most else f"{top} is above {self.at_most}"
#
#       and in models.toml:  "my_checks:MaxProbability" = { at_most = 0.99 }
#
#
# ---- Fields -------------------------------------------------------------------------------
#
#   backend       "typesafe", "openrouter" or "uniform"; sets the defaults below
#                                                                        (default "typesafe")
#   model         the model id sent in the request ("typesafe/jev-1.13")     (default: <name>)
#   display_name  a readable name, for pages and reports                    (default: <name>)
#   base_url      where the SDK sends requests; /v1/systemone is added
#                     typesafe:   TypeSafe's API (the SDK's default)
#                     openrouter: https://openrouter.ai/api
#   key_env       the environment variable with the API key
#                     typesafe:   TYPESAFE_API_KEY
#                     openrouter: OPENROUTER_API_KEY
#                 It is read only when a question is not in the cache, so a machine without it
#                 still serves every cached answer.
#   extra_body    fields merged into every request body, e.g. OpenRouter's provider routing:
#                 { provider = { only = ["typesafe"], allow_fallbacks = false } } keeps every
#                 answer with one provider. Part of the request, so part of the cache key.
#                 Other options: https://openrouter.ai/docs/features/provider-routing
#   compression   false: send requests uncompressed       (openrouter: false; else the SDK's)
#   timeout       seconds per request                                  (default: the SDK's)
#   max_retries   retries on rate limits, server errors and timeouts   (default: the SDK's)
#   cache         false: always ask, never store                                (default true)
#   requirements  see above                                                       (default none)
#
#   backend = "uniform" is a local baseline that gives every option the same probability: no
#   network, no key, no cost, answers valid System One responses.
#
#
# ---- Examples -----------------------------------------------------------------------------

# The baseline. Useful for trying the router and for comparing against.
[models.uniform]
backend = "uniform"

# Jev through OpenRouter, one release from one provider. (Checked 2026-10-16 against
# https://openrouter.ai/api/v1/models/typesafe/jev-1.13/endpoints.)
[models.jev]
backend = "openrouter"
model = "typesafe/jev-1.13"
display_name = "Jev 1.13 (2026-09-17)"
extra_body = { provider = { only = ["typesafe"], allow_fallbacks = false } }

[models.jev.requirements]
systemone_response_model_id = "typesafe/jev-1.13-20260917"
openrouter_response_provider = "TypeSafe"

# The rest are templates: replace the names, ids and hosts with your own.

# Jev directly from TypeSafe. (The response's `model` there is TypeSafe's own name for the
# release, such as "jev-1.13.0"; check what it reports before you require it.)
# [models.jev-typesafe]
# model = "jev-1.13"
# display_name = "Jev 1.13 (TypeSafe)"
# requirements = { systemone_response_model_id = "jev-1.13.0" }

# A model whose responses don't say which release answered: one run, in a one-day window.
# [models.decider-2026-10-16]
# backend = "openrouter"
# model = "example-org/decider"
# extra_body = { provider = { only = ["example-provider"], allow_fallbacks = false } }
# requirements = { request_date_range = ["2026-10-16T09:00:00Z", "2026-10-17T09:00:00Z"] }

# The same model, allowed to fall back to other providers: answers may come from any of them,
# so they are not cached.
# [models.decider-any-provider]
# backend = "openrouter"
# model = "example-org/decider"
# cache = false

# Your own System One server. The name says which weights it serves; a requirement of your own
# checks what the server reports.
# [models.decider-4b-3f2a9c1]
# base_url = "http://localhost:8000"
# key_env = "DECIDER_API_KEY"
# model = "decider-4b"
# timeout = 120
# max_retries = 5
# requirements = { "my_checks:ServesWeights" = "example-org/decider-4b@3f2a9c1" }

# The baseline, asked every time and never stored.
# [models.uniform-uncached]
# backend = "uniform"
# cache = false
